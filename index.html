    />
    <script>
      (function () {
        try {
          var ownDesc = Object.getOwnPropertyDescriptor(window, "fetch");
          var protoDesc = window.Window ? Object.getOwnPropertyDescriptor(window.Window.prototype, "fetch") : null;
          var isGetterOnly = (ownDesc && ownDesc.get && !ownDesc.set) || (!ownDesc && protoDesc && protoDesc.get && !protoDesc.set);
          if (isGetterOnly && (!ownDesc || ownDesc.configurable)) {
            var origFetch = window.fetch.bind(window);
            Object.defineProperty(window, "fetch", {
              value: origFetch,
              writable: true,
              configurable: true,
              enumerable: true,
            });
          }
        } catch (e) {}

        window.addEventListener(
          "error",
          function (event) {
            var src = event && (event.filename || (event.error && event.error.stack) || "");
            if (typeof src === "string" && (src.indexOf("chrome-extension://") !== -1 || src.indexOf("moz-extension://") !== -1)) {
              event.preventDefault();
              if (typeof event.stopImmediatePropagation === "function") {
                event.stopImmediatePropagation();
              }
            }
          },
          true,
        );
      })();
    </script>
